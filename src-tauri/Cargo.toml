[package]
name = "tubemarks"
version = "0.1.0"
description = "A desktop bookmark manager for YouTube videos, Shorts, playlists and channels"
edition = "2021"

[lib]
name = "tubemarks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews, used to show channel pages inside the viewer drawer.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same sqlx the SQL plugin already builds; used to read the old app's database read-only.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "charset"] }
